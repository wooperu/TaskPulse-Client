<main class="flex min-h-dvh items-center justify-center bg-slate-50 px-4 py-10 text-slate-900">
  <section class="w-full max-w-md">
    <a routerLink="/" class="mb-8 inline-flex items-center gap-3" aria-label="TaskPulse home">
      <span class="flex size-11 items-center justify-center rounded-xl bg-indigo-600 text-xl font-bold text-white">
        T
      </span>
      <span class="text-2xl font-bold tracking-tight">TaskPulse</span>
    </a>

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <p class="mb-2 text-sm font-semibold text-indigo-600">{{ code() }}</p>
      <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">{{ heading() }}</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">{{ message() }}</p>

      <div class="mt-6 flex flex-col gap-3 sm:flex-row">
        <ng-content />
      </div>
    </div>
  </section>
</main>
