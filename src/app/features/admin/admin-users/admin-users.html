<div class="space-y-6">
    <header>
        <h1 class="text-2xl font-semibold tracking-tight">User management</h1>
        <p class="mt-1 text-sm text-zinc-500">Change the role of a user.</p>
    </header>

    <p role="status" class="text-sm text-zinc-700">{{ statusMessage() }}</p>

    <section aria-labelledby="form-heading" class="rounded-xl border border-zinc-200 bg-white p-5">
        <h2 id="form-heading" class="text-sm font-medium">Change role</h2>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="mt-4 space-y-4">
            <div class="grid gap-4 sm:grid-cols-[1fr_auto]">
                <div>
                    <label for="userId" class="mb-1 block text-xs font-medium text-zinc-600">User ID</label>
                    <input
                        id="userId"
                        type="text"
                        formControlName="userId"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="00000000-0000-0000-0000-000000000000"
                        [attr.aria-invalid]="userIdError() !== null"
                        class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 font-mono text-sm outline-hidden transition placeholder:text-zinc-500 focus:border-zinc-900 focus:ring-2 focus:ring-zinc-200"
                    />
                    @if (userIdError(); as message) {
                        <p class="mt-2 text-sm text-red-600">{{ message }}</p>
                    }
                </div>

                <div>
                    <label for="role" class="mb-1 block text-xs font-medium text-zinc-600">New role</label>
                    <select
                        id="role"
                        formControlName="role"
                        class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm outline-hidden focus:border-zinc-900 focus:ring-2 focus:ring-zinc-200"
                    >
                        @for (role of roles; track role) {
                            <option [value]="role">{{ roleLabels[role] }}</option>
                        }
                    </select>
                </div>
            </div>

            @if (formError()) {
                <p role="alert" class="text-sm text-red-600">{{ formError() }}</p>
            }

            <button
                type="submit"
                [disabled]="busy()"
                class="rounded-lg bg-zinc-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-zinc-800 focus:outline-hidden focus-visible:ring-2 focus-visible:ring-zinc-900 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
            >
                {{ busy() ? 'Saving…' : 'Change role' }}
            </button>
        </form>
    </section>
</div>
