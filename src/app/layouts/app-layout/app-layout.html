
<div class="min-h-dvh bg-stone-50 text-zinc-900 md:flex">
  <!-- Sidebar -->
  <aside class="flex w-full flex-col border-b border-zinc-200 bg-white md:sticky md:top-0 md:h-dvh md:w-60 md:shrink-0 md:self-start md:overflow-y-auto md:border-r md:border-b-0">
    <a
      routerLink="/dashboard"
      class="flex items-center gap-3 px-5 py-5"
    >
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-zinc-900 text-lg font-semibold text-white">
        T
      </div>

      <div>
        <p class="text-base font-semibold tracking-tight">
          TaskPulse
        </p>
        <p class="text-xs text-zinc-500">
          Your day, organized.
        </p>
      </div>
    </a>

    <div class="px-3 pb-3 pt-2">
      <p class="mb-2 px-3 text-[11px] font-semibold tracking-widest text-zinc-400">
        WORKSPACE
      </p>

      <nav class="flex gap-1 md:flex-col" aria-label="Primary">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-zinc-100 text-zinc-950"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-zinc-600 transition hover:bg-zinc-100"
        >
          <span aria-hidden="true">⌂</span>
          Dashboard
        </a>

        <a
          routerLink="/workspaces"
          routerLinkActive="bg-zinc-100 text-zinc-950"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-zinc-600 transition hover:bg-zinc-100"
        >
          <span aria-hidden="true">▦</span>
          Workspaces
        </a>

        <a
          routerLink="/tasks"
          routerLinkActive="bg-zinc-100 text-zinc-950"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-zinc-600 transition hover:bg-zinc-100"
        >
          <span aria-hidden="true">☷</span>
          My Tasks
        </a>
      </nav>
    </div>

    <div class="mt-auto hidden border-t border-zinc-100 p-4 md:block">
      <div class="rounded-xl bg-zinc-50 p-3">
        <div class="flex items-center gap-2">
          <span
            class="h-2 w-2 rounded-full bg-zinc-400"
            aria-hidden="true"
          ></span>

          <p class="text-xs font-medium text-zinc-700">
            Sync status
          </p>
        </div>

        <p class="mt-1 text-xs text-zinc-500">
          Not connected yet
        </p>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <div class="min-w-0 flex-1">
    <header class="flex h-16 items-center justify-between border-b border-zinc-200 bg-white px-5 sm:px-8 sticky top-0 z-10">
      <p class="text-sm text-zinc-500">
        Workspace <span class="mx-2">/</span>
        <span class="font-medium text-zinc-900">TaskPulse</span>
      </p>

      <button
        type="button"
        class="flex h-9 w-9 items-center justify-center rounded-full border border-zinc-200 bg-zinc-50 text-sm font-medium hover:bg-zinc-100"
        aria-label="User profile"
        title="User profile"
      >
        U
      </button>
    </header>

    <main class="mx-auto w-full max-w-6xl p-5 sm:p-8 lg:p-10">
      <router-outlet />
    </main>
  </div>
</div>
